<app-navbar></app-navbar>
<h1>My recipe collection</h1>

<div class="container">
  <div class="page-header">
    <p>{{ recipeStats }}</p>
    <app-search (searchQuery)="onPrivateSearch($event)"></app-search>
  </div>

  @if (loading) {
    <div class="loader">Loading your recipes...</div>
  } @else {
    <div class="recipe-grid">
      @for (r of myRecipes; track r._id) {
        <app-recipecard
          [recipe]="r"
          [canDelete]="true"
          [isOwnRecipe]="true"
          (deleteRequest)="onDeleteRecipe($event)"
        ></app-recipecard>
      } @empty {
        <div class="empty-state">
          <h3>No recipes here yet...</h3>
          <p>You haven't created any recipes yet.</p>
        </div>
      }
    </div>
  }
  <a routerLink="/favorites" routerLinkActive="active"> ❤️ Suosikit </a>
</div>
