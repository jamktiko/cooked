<app-navbar></app-navbar>

<div
  class="relative flex h-[calc(100dvh-85px)] w-full flex-col items-center justify-center pb-20 overflow-hidden"
  (touchstart)="onTouchStart($event)"
  (touchmove)="onTouchMove($event)"
  (touchend)="endDrag()"
  (mousedown)="onMouseDown($event)"
  (mousemove)="onMouseMove($event)"
  (mouseup)="endDrag()"
  (mouseleave)="endDrag()"
>
  @if (showFireAnimation) {
    <div
      class="fixed inset-0 z-50 flex items-center justify-center pointer-events-none bg-white/40 backdrop-blur-sm"
    >
      <div class="flex flex-col items-center">
        <i
          class="fa-solid fa-fire text-orange-500 text-[100px] md:text-[150px] drop-shadow-xl fire-icon-animate"
        ></i>
        <h2
          class="text-5xl md:text-7xl font-bold text-orange-600 mt-4 match-text-animate tracking-wider uppercase drop-shadow-md"
        >
          Cooked!
        </h2>
      </div>
    </div>
  }

  @if (isLoading) {
    <div class="flex flex-col items-center text-[#E67E22]">
      <i class="fas fa-circle-notch fa-spin text-5xl mb-4"></i>
      <p class="font-bold">Fetching recipes...</p>
    </div>
  } @else if (currentRecipe) {
    <div
      class="swipe-card absolute -mt-12 sm:mt-0 flex w-[320px] sm:w-[380px] flex-col overflow-hidden rounded-3xl bg-white shadow-2xl cursor-grab active:cursor-grabbing z-10"
      [style.transform]="transformString"
      [style.transition]="
        isDragging ? 'none' : 'transform 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275)'
      "
    >
      @if (currentX > 30) {
        <div
          class="absolute top-12 left-8 flex items-center gap-2 border-4 border-green-500 text-green-500 font-bold uppercase p-3 rotate-[-15deg] rounded-xl opacity-90 text-5xl pointer-events-none z-30 bg-white/90"
        >
          COOK <i class="fa-solid fa-fire text-orange-500"></i>
        </div>
      }
      @if (currentX < -30) {
        <div
          class="absolute top-12 right-8 border-4 border-red-500 text-red-500 font-bold uppercase p-3 rotate-[15deg] rounded-xl opacity-90 text-5xl pointer-events-none z-30 bg-white/90"
        >
          NOPE
        </div>
      }

      <div class="w-full pointer-events-none">
        <app-recipecard
          [recipe]="currentRecipe"
          [showFavoriteButton]="false"
          class="[&_.h-48]:h-64 [&_.h-48]:sm:h-72"
        ></app-recipecard>
      </div>
    </div>

    <div class="absolute bottom-20 md:bottom-8 z-20 flex w-full justify-center gap-12 md:gap-16">
      <button
        (click)="handleSkip()"
        class="flex h-16 w-16 md:h-20 md:w-20 items-center justify-center rounded-full bg-white text-red-500 shadow-xl transition-transform hover:scale-110 active:scale-95 border border-zinc-100"
      >
        <i class="fas fa-times text-3xl md:text-4xl"></i>
      </button>
      <button
        (click)="handleMatch()"
        class="flex h-16 w-16 md:h-20 md:w-20 items-center justify-center rounded-full bg-white text-green-500 shadow-xl transition-transform hover:scale-110 active:scale-95 border border-zinc-100"
      >
        <i class="fa-solid fa-fire text-3xl md:text-4xl"></i>
      </button>
    </div>
  } @else {
    <div class="col-span-full mx-auto w-full px-6 md:max-w-md">
      <div
        class="flex flex-col items-center rounded-[3rem] border border-black/5 bg-white/40 p-10 shadow-xl text-center"
      >
        <div
          class="mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-[#D6E5E5] text-[#305252]"
        >
          <i class="fa-solid fa-arrow-right-arrow-left text-3xl"></i>
        </div>

        <h2
          class="font-bebas mb-4 text-4xl font-bold tracking-tight text-zinc-800 uppercase leading-none md:text-5xl"
        >
          That's all!
        </h2>

        <p class="font-sarabun mb-8 text-lg text-zinc-600 leading-relaxed">
          You've gone through all the recipes. <br />
          Want to take another look?
        </p>

        <button
          onclick="window.location.reload()"
          class="font-bebas w-full rounded-full bg-[#305252] py-4 text-2xl font-bold tracking-wide text-white uppercase shadow-lg transition-all hover:brightness-110 active:scale-95 flex items-center justify-center gap-3"
        >
          <i class="fa-solid fa-rotate-left text-xl"></i>
          Start Again
        </button>
      </div>
    </div>
  }
</div>
