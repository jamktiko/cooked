<div class="upload-card">
  <h3>Lataa kuva S3-palveluun</h3>

  <div class="file-input-wrapper">
    <input 
      type="file" 
      (change)="onFileSelected($event)" 
      accept="image/*"
      #fileInput
    />
  </div>

  @if (previewUrl()) {
    <div class="preview-container">
      <img [src]="previewUrl()" alt="Esikatselu" class="preview-img" />
    </div>
  }
</div>
