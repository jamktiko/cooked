<app-navbar></app-navbar>

<main class="mx-auto w-full max-w-6xl flex-1 px-6 pt-8 pb-32 md:pb-12">
@if(!this.editStatus){
<div class="mx-auto w-full md:max-w-2xl mb-4 text-left">
  <h2 class="font-bebas text-4xl font-bold tracking-tight text-zinc-800 uppercase leading-none md:text-5xl">My profile</h2>
</div>
<div class="mx-auto w-full rounded-[3rem] border border-black/5 bg-[#FFF8E7] p-8 shadow-xl md:max-w-2xl">
  
  <div class="flex items-center gap-6 mb-8 border-b border-black/5 pb-8">
    <img class="h-24 w-24 rounded-full border-4 border-white bg-white shadow-md object-cover" [src]="this.user?.prof_picture| s3Url" alt="Profile Picture" />
    <div>
      <h3 class="font-bebas text-3xl font-bold tracking-tight text-zinc-800 uppercase leading-none">{{this.user?.username || 'Username'}}</h3>
    </div>
    <button class="font-bebas ml-auto rounded-full bg-cooked-dark py-2 px-6 text-lg font-bold tracking-wide text-white uppercase shadow-md transition-all hover:brightness-110 active:scale-95" (click)="edit()">
        <i class="fa-solid fa-pencil mr-2"></i> Edit profile
    </button>
  </div>

  <div class="space-y-6">
    <div>
      <label class="font-sarabun ml-4 block text-sm font-bold text-zinc-700 mb-1">About Me</label>
      <div class="w-full rounded-4xl bg-white px-6 py-4 shadow-inner min-h-24">
        <p class="font-sarabun text-zinc-600 italic">{{this.user?.info || 'No description...'}}</p>
      </div>
    </div>

    <div class="pt-2 border-t border-black/5">
      <h2 class="font-bebas text-2xl font-bold tracking-tight text-zinc-800 uppercase mt-4 mb-4 ml-4">Account details</h2>
      <div class="space-y-4">
        <div>
          <label class="font-sarabun ml-4 block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1"><i class="fa-solid fa-envelope mr-1"></i> Email</label>
          <div class="w-full rounded-full bg-white px-6 py-3 shadow-inner">
            <p class="font-sarabun font-bold text-zinc-800">{{this.user?.email}}</p>
          </div>
        </div>
        
        <div>
          <label class="font-sarabun ml-4 block text-xs font-bold text-zinc-500 uppercase tracking-wider mb-1"><i class="fa-solid fa-calendar mr-1"></i> Profile created</label>
          <div class="w-full rounded-full bg-white px-6 py-3 shadow-inner">
            <p class="font-sarabun font-bold text-zinc-800">{{this.user?.prof_created | date:'dd.MM.yyyy HH:mm'}}</p>
          </div>
        </div>
      </div>
    </div>

    <div class="flex flex-col gap-4 pt-6 md:flex-row border-t border-black/5">
      <button (click)="logout()" type="button" class="font-bebas flex-1 rounded-full bg-[#FBC091] py-4 text-2xl font-bold tracking-wide text-zinc-800 uppercase shadow-lg transition-all hover:brightness-105 active:scale-95">
        <i class="fa-solid fa-arrow-right-from-bracket mr-2"></i> Log out
      </button>
    </div>
  </div>

</div>
}@else {
  <div class="mx-auto w-full md:max-w-2xl mb-4 text-left">
    <h2 class="font-bebas text-4xl font-bold tracking-tight text-zinc-800 uppercase leading-none md:text-5xl">Edit profile</h2>
  </div>
  <div class="mx-auto w-full rounded-[3rem] border border-black/5 bg-[#FFF8E7] p-8 shadow-xl md:max-w-2xl">
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()" class="space-y-6">
      
      <div>
        <label class="font-sarabun ml-4 block text-sm font-bold text-zinc-700" for="username">Username</label>
        <input class="mt-1 w-full rounded-full border-none bg-white px-6 py-3 shadow-inner outline-none focus:ring-2 focus:ring-cooked-dark" id="username" type="text" formControlName="username" [placeholder]="this.user?.username || 'Username'" />
      </div>

      <div>
        <label class="font-sarabun ml-4 block text-sm font-bold text-zinc-700" for="info">About You</label>
        <textarea rows="4" class="mt-1 w-full resize-none rounded-4xl border-none bg-white px-6 py-4 shadow-inner outline-none focus:ring-2 focus:ring-cooked-dark placeholder:italic" id="info" type="text" formControlName="info" [placeholder]="this.user?.info || 'Share your cooking journey...'"></textarea>
      </div>

      <div class="pt-4 border-t border-black/5">
        <label class="font-sarabun mb-4 ml-4 block text-sm font-bold text-zinc-700">Profile photo</label>
        <div class="flex flex-col items-center gap-6 md:flex-row">
          <div class="relative group">
            <img class="h-24 w-24 rounded-full border-4 border-white bg-white shadow-md" [src]="this.user?.prof_picture| s3Url" alt="Profile Picture" />
            <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">
              <i class="fa-solid  text-xl text-zinc-800"></i>
            </div>
          </div>
          
          <div class="flex flex-1 flex-col gap-2 w-full">
            <button class="font-bebas w-full rounded-full bg-white border border-black/5 py-2 text-lg font-bold text-zinc-500 uppercase shadow-sm transition-all hover:text-red-500" type="button" (click)="removeImage()">
              <i class="fa-solid fa-trash-can mr-2"></i> Remove photo
            </button>
            <app-uploadimg folder="profiles" (fileSelected)="onImageSelected($event)"></app-uploadimg>
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-4 pt-6 md:flex-row">
        <button class="font-bebas flex-1 rounded-full bg-cooked-dark py-4 text-2xl font-bold tracking-wide text-white uppercase shadow-lg transition-all hover:brightness-110 active:scale-95" type="submit">Save changes</button>
        <button class="font-bebas flex-1 rounded-full bg-[#FBC091] py-4 text-2xl font-bold tracking-wide text-zinc-800 uppercase shadow-lg transition-all hover:brightness-105 active:scale-95" type="button" (click)="edit()">Cancel</button>
      </div>
    </form>
  </div>
}
</main>
