<div
  class="relative w-full shadow-md rounded-full border border-black/5 md:w-64 lg:w-80 overflow-hidden bg-white"
>
  <input
    type="text"
    [formControl]="searchControl"
    placeholder="Search recipes..."
    class="block w-full bg-transparent px-6 py-2 pr-12 outline-none text-zinc-700 placeholder:italic leading-none"
  />
  <button
    type="button"
    class="absolute right-4 top-1/2 -translate-y-1/2 text-zinc-400 hover:text-[#305252] transition-colors"
  >
    <i class="fas fa-search"></i>
  </button>
</div>
