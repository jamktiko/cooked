<div class="md:hidden sticky top-0 z-50 bg-cooked-light px-6 py-3 shadow-sm flex justify-center [transform:translateZ(0)]">
  <a routerLink="/frontpage" class="block cursor-pointer">
    <img src="cooked_logo.png" alt="Cooked" class="h-10 w-auto" />
  </a>
</div>

<header class="hidden md:block sticky top-0 z-50 bg-cooked-light px-6 py-4 shadow-sm font-bebas [transform:translateZ(0)]">
  <div class="mx-auto flex max-w-6xl items-center justify-between">
    <a routerLink="/frontpage" class="block cursor-pointer">
      <img src="cooked_logo.png" alt="Cooked" class="h-14 w-auto" />
    </a>

    <nav class="flex items-center gap-3">
      <a
        routerLink="/frontpage"
        routerLinkActive="!bg-cooked-dark !text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-full bg-cooked-orange px-6 py-2 text-zinc-900 uppercase shadow-sm transition-all hover:bg-orange-600 hover:text-white"
        >Home</a
      >

      @if (isUserLoggedIn$ | async) {
        <a
          routerLink="/my-recipes"
          routerLinkActive="!bg-cooked-dark !text-white"
          class="rounded-full bg-cooked-orange px-6 py-2 text-zinc-900 uppercase shadow-sm transition-all hover:bg-orange-600 hover:text-white"
          >My Recipes</a
        >
        <a
          routerLink="/new-recipe"
          routerLinkActive="!bg-cooked-dark !text-white"
          class="rounded-full bg-cooked-orange px-6 py-2 text-zinc-900 uppercase shadow-sm transition-all hover:bg-orange-600 hover:text-white"
          >Add Recipe</a
        >
        <a
          routerLink="/favorites"
          routerLinkActive="!bg-cooked-dark !text-white"
          class="rounded-full bg-cooked-orange px-4 py-2 text-zinc-900 uppercase shadow-sm transition-all hover:bg-orange-600 hover:text-white"
        >
          <i class="fa-solid fa-heart"></i>
        </a>
        <a
          routerLink="/swipe"
          routerLinkActive="!bg-cooked-dark !text-white"
          class="rounded-full bg-cooked-orange px-4 py-2 text-zinc-900 shadow-sm transition-all hover:bg-orange-600 hover:text-white"
          ><i class="fa-solid fa-random"></i
        ></a>
        <a
          (click)="goToProfile($event)"
          [class.!bg-cooked-dark]="isProfileActive"
          [class.!text-white]="isProfileActive"
          class="rounded-full bg-cooked-orange px-4 py-2 text-zinc-900 cursor-pointer shadow-sm transition-all hover:bg-orange-600 hover:text-white"
          ><i class="fas fa-user-circle"></i
        ></a>
      }

      @if (!(isUserLoggedIn$ | async)) {
        <a
          (click)="login()"
          class="rounded-full bg-cooked-orange px-6 py-2 text-zinc-900 uppercase shadow-sm cursor-pointer transition-all hover:bg-orange-600 hover:text-white"
          >Sign In</a
        >
        <a
          (click)="signup()"
          class="rounded-full bg-cooked-orange px-6 py-2 text-zinc-900 uppercase shadow-sm cursor-pointer transition-all hover:bg-orange-600 hover:text-white"
          >Sign Up</a
        >
      }
    </nav>
  </div>
</header>

<nav
  class="fixed bottom-0 z-50 flex h-[80px] w-full border-t border-black/5 bg-cooked-orange font-bebas md:hidden [transform:translateZ(0)]"
>
  <a
    routerLink="/frontpage"
    routerLinkActive="bg-cooked-dark !text-white"
    [routerLinkActiveOptions]="{ exact: true }"
    class="flex flex-1 flex-col items-center justify-center text-zinc-800 transition-colors"
  >
    <i class="fas fa-fire-alt text-xl opacity-70"></i>
    <span class="mt-1 text-[13px] uppercase">Home</span>
  </a>

  @if (isUserLoggedIn$ | async) {
    <a
      routerLink="/my-recipes"
      routerLinkActive="bg-cooked-dark !text-white"
      class="flex flex-1 flex-col items-center justify-center text-zinc-800 transition-colors"
    >
      <i class="fas fa-book text-xl opacity-70"></i>
      <span class="mt-1 text-[13px] uppercase">Recipes</span>
    </a>
    <a
      routerLink="/new-recipe"
      routerLinkActive="bg-cooked-dark !text-white"
      class="flex flex-1 flex-col items-center justify-center text-zinc-800 transition-colors"
    >
      <i class="fas fa-plus text-xl opacity-70"></i>
      <span class="mt-1 text-[13px] uppercase">Add recipe</span>
    </a>
    <a
      routerLink="/favorites"
      routerLinkActive="bg-cooked-dark !text-white"
      class="flex flex-1 flex-col items-center justify-center text-zinc-800 transition-colors"
    >
      <i class="fas fa-heart text-xl opacity-70"></i>
      <span class="mt-1 text-[13px] uppercase">Favorites</span>
    </a>
    <a
      routerLink="/swipe"
      routerLinkActive="bg-cooked-dark !text-white"
      class="flex flex-1 flex-col items-center justify-center text-zinc-800 transition-colors"
    >
      <i class="fas fa-random text-xl opacity-70"></i>
      <span class="mt-1 text-[13px] uppercase">Swipe</span>
    </a>
    <a
      (click)="goToProfile($event)"
      [class.bg-cooked-dark]="isProfileActive"
      [class.!text-white]="isProfileActive"
      class="flex flex-1 flex-col items-center justify-center cursor-pointer text-zinc-800 transition-colors"
    >
      <i class="fas fa-user-circle text-xl opacity-70"></i>
      <span class="mt-1 text-[13px] uppercase">Profile</span>
    </a>
  } @else {
    <a
      (click)="login()"
      class="flex flex-1 flex-col items-center justify-center cursor-pointer text-zinc-800"
    >
      <i class="fas fa-sign-in-alt text-xl opacity-70"></i>
      <span class="mt-1 text-[13px] uppercase">Sign In</span>
    </a>
    <a
      (click)="signup()"
      class="flex flex-1 flex-col items-center justify-center cursor-pointer text-zinc-800"
    >
      <i class="fas fa-user-plus text-xl opacity-70"></i>
      <span class="mt-1 text-[13px] uppercase">Sign Up</span>
    </a>
  }
</nav>
