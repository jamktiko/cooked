@if (isLoggedIn) {
  <button
    type="button"
    (click)="toggle($event)"
    [disabled]="loading"
    class="flex items-center justify-center w-10 h-10 rounded-full transition-colors shadow-sm"
    [class]="isFavorite ? 'bg-red-50 text-red-600' : 'bg-gray-50 text-gray-400 hover:bg-gray-100'"
  >
    <i [class]="isFavorite ? 'fa-solid fa-heart' : 'fa-regular fa-heart'"></i>
  </button>
}
