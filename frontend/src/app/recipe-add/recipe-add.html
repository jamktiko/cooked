<div>
  <a class="link" href="/frontpage">frontpage</a>
</div>

<form [formGroup]="recipeForm" (ngSubmit)="onSubmit()" class="recipe-form">
  <h2>Lisää uusi resepti</h2>

  <div class="form-group">
    <label for="recipeName">Reseptin nimi:</label>
    <input id="recipeName" name="recipeName" formControlName="name" placeholder="esim. Bolognese" />
  </div>

  <div class="form-group">
    <label for="recipeDescription">Kuvaus:</label>
    <textarea
      id="recipeDescription"
      name="description"
      formControlName="description"
      placeholder="Lyhyt kuvaus reseptistä"
    ></textarea>
  </div>

  <div class="form-group">
    <label for="recipeServings">Annokset:</label>
    <input id="recipeServings" name="servings" formControlName="servings" type="number" min="1" />
  </div>

  <div class="form-group">
    <label for="recipeDuration">Kesto (min):</label>
    <input id="recipeDuration" name="duration" formControlName="duration" min="0" type="number" />
  </div>

  <hr />

  <h3>Ainesosat</h3>
  <div formArrayName="ingredients">
    @for (ing of ingredients.controls; track ing; let i = $index) {
      <div [formGroupName]="i" class="row">
        <input
          [id]="'ingName' + i"
          name="ingredientName"
          formControlName="name"
          placeholder="raaka-aine"
        />
        <input
          [id]="'ingAmount' + i"
          name="ingredientAmount"
          formControlName="amount"
          type="number"
          placeholder="määrä"
        />
        <input
          [id]="'ingUnit' + i"
          name="ingredientUnit"
          formControlName="unit"
          placeholder="yksikkö"
        />
        <button type="button" (click)="removeIngredient(i)" class="remove-btn">Poista</button>
      </div>
    }
    <button type="button" (click)="addIngredient()" class="add-btn">+ Lisää ainesosa</button>
  </div>

  <hr />

  <h3>Työvaiheet</h3>
  <div formArrayName="directions">
    @for (dir of directions.controls; track dir; let i = $index) {
      <div class="row">
        <input
          [id]="'dir' + i"
          [name]="'direction' + i"
          [formControlName]="i"
          placeholder="Vaihe {{ i + 1 }}"
        />
        <button type="button" (click)="removeDirection(i)" class="remove-btn">Poista</button>
      </div>
    }
    <button type="button" (click)="addDirection()" class="add-btn">+ Lisää vaihe</button>
  </div>

  <hr />

  <h3>Tagit (avainsanat)</h3>
  <div formArrayName="tags" class="tags-container">
    @for (tag of tags.controls; track tag; let i = $index) {
      <div class="tag-row">
        <input
          [id]="'tag' + i"
          [name]="'tag' + i"
          [formControlName]="i"
          placeholder="esim. vegaani"
        />
        <button type="button" (click)="removeTag(i)" class="remove-tag-btn">×</button>
      </div>
    }
    <button type="button" (click)="addTag()" class="add-btn">+ Lisää tagi</button>
  </div>

  <hr />

  <div class="form-group checkbox-group">
    <label for="isPublic">
      <input type="checkbox" id="isPublic" name="public" formControlName="public" />
      Julkinen resepti
    </label>
  </div>
  <div class="uploadimg">
    <app-uploadimg folder="recipes" (fileSelected)="onImageSelected($event)"></app-uploadimg>
  </div>
  <button type="submit" [disabled]="recipeForm.invalid" class="submit-btn">Tallenna resepti</button>
</form>
